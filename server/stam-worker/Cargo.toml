[package]
name = "stam-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
stam-core = { version = "0.1.0", path = "../stam-core" }
stam-room = { version = "0.1.0", path = "../stam-room" }
worker = { version = "0.8.7", features = ["d1"] }
