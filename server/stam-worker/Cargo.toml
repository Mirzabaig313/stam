[package]
name = "stam-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23.1"
form_urlencoded = "1.2.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hmac = "0.13.0"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
stam-core = { version = "0.1.0", path = "../stam-core" }
stam-room = { version = "0.1.0", path = "../stam-room" }
worker = { version = "0.8.7", features = ["d1"] }
